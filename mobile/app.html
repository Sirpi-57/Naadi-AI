    <script src="shared.js"></script>
    <script>
        // ════════ AUTH GATE ════════
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                currentUser = user;
                idToken = await user.getIdToken();

                // First-run tour. The localStorage flag means the check costs
                // one request per device, not one per app open.
                if (await needsOnboarding(user.uid)) {
                    window.location.href = 'onboarding.html';
                    return;
                }

                // Home paints the greeting from /api/home; render it now that
                // we have a token (the Home view is the default active view).
                if (document.getElementById('view-dashboard')?.classList.contains('active')) {
                    loadHome();
                }

                // Doubts badge. Deliberately independent of the Doubts
                // screen: a reply that lands while the student is in OPD
                // still has to light the top-bar icon. One document read
                // per minute.
                if (typeof ndDoubtsBadgeStart === 'function') {
                    ndDoubtsBadgeStart(setDoubtsBadge);
                }
            } else {
                window.location.href = 'login.html';
            }
        });

        // Paints the unread count on both Doubts entry points. Only one
        // is ever visible at a time (the top-bar icon on phones, the
        // sidebar row on desktop), but writing to both is cheaper than
        // asking which layout we are in.
        function setDoubtsBadge(n) {
            const count = Number(n) || 0;
            const label = count > 99 ? '99+' : String(count);
            ['dbt-badge', 'dbt-badge-side'].forEach(id => {
                const el = document.getElementById(id);
                if (!el) return;
                el.textContent = label;
                el.classList.toggle('hidden', !count);
            });
        }

        // Returns true only when we are certain the student has never seen
        // the tour. Any failure (offline, backend not yet deployed) returns
        // false: a broken check must never lock a student out of the app.
        async function needsOnboarding(uid) {
            let seen = null;
            try { seen = localStorage.getItem('naadi_onb_' + uid); } catch (e) { /* private mode */ }
            if (seen === '1') return false;

            try {
                const acct = await apiCall('/api/user/account');
                if (acct.onboarding_completed) {
                    try { localStorage.setItem('naadi_onb_' + uid, '1'); } catch (e) { }
                    return false;
                }
                return true;
            } catch (e) {
                console.warn('Onboarding check skipped:', e.message);
                return false;
            }
        }

        async function handleLogout() {
            try { await auth.signOut(); } catch (e) { /* ignore */ }
            window.location.href = 'login.html';
        }

        // ════════ NAVIGATION (views-as-divs + navigate(), same pattern
        //          as the desktop app.html) ════════
        // Profile is a real view now; nothing else is stubbed. Kept so
        // showComingSoon() still has a copy table to grow into.
        const SOON_COPY = {};

        function navigate(viewName, params = {}) {
            // Home runs a 30s quote timer — never let it tick against a
            // hidden view. loadHome() restarts it when we come back.
            if (viewName !== 'dashboard' && typeof stopHomeTimers === 'function') stopHomeTimers();
            // Same rule for Doubts: an 8s thread poll must never tick
            // against a view the student has navigated away from.
            if (viewName !== 'doubts' && typeof ndDoubtsUnmount === 'function') ndDoubtsUnmount();

            // Tell Nia which surface this is. Costs nothing — the context
            // is a plain object and is only ever SENT when the student
            // actually presses send. Views not listed fall to 'generic'.
            // The *_test entries are what make Nia disappear during a live
            // paper; the server refuses them independently.
            if (typeof niaSetContext === 'function') {
                const NIA_SURFACE = {
                    'revise-journey': 'studio',
                    'opd-test': 'opd_test',
                    'arena-test': 'arena_test',
                    'pyq-test': 'pyq_test',
                    'opd-results': 'opd_review',
                    'opd-analysis': 'opd_review',
                    'arena-results': 'arena_review',
                };
                niaSetContext({ surface: NIA_SURFACE[viewName] || 'generic' });
            }

            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.mnav-item').forEach(n => n.classList.remove('active'));

            const topbar = document.getElementById('m-topbar');
            const tabbar = document.getElementById('m-tabbar');
            const main = document.getElementById('m-main');
            topbar.style.display = '';
            tabbar.classList.remove('hidden');
            main.classList.remove('no-tabbar');

            // Home wears the wordmark; every other view keeps its dynamic title.
            const isHome = viewName === 'dashboard';
            document.getElementById('topbar-brand')?.classList.toggle('show', isHome);
            document.getElementById('topbar-titleblock')?.classList.toggle('hidden', isHome);
            // Home's hero band is #0B1220 and sits flush under the bar.
            // .home-mode repaints the bar in that same ink so the two read
            // as one surface. Cosmetic only — no routing depends on it.
            document.body.classList.toggle('home-mode', isHome);

            switch (viewName) {
                case 'dashboard':
                    document.getElementById('view-dashboard').classList.add('active');
                    document.getElementById('topbar-title').textContent = 'NAADI AI';
                    document.querySelector('.mnav-item[data-view="dashboard"]')?.classList.add('active');
                    loadHome();
                    break;

                case 'coming-soon':
                    document.getElementById('view-coming-soon').classList.add('active');
                    document.getElementById('topbar-title').textContent = params.title || 'Coming Soon';
                    break;

                case 'quick-revise':
                    document.getElementById('view-quick-revise').classList.add('active');
                    document.getElementById('topbar-title').textContent = 'Concept Studio';
                    document.querySelector('.mnav-item[data-view="quick-revise"]')?.classList.add('active');
                    loadQuickRevise();
                    break;

                case 'revise-journey':
                    document.getElementById('view-revise-journey').classList.add('active');
                    // Journey is a focused full-screen study mode: hide the
                    // shell top bar + tab bar; the journey renders its own
                    // sticky top bar and sticky prev/next footer.
                    topbar.style.display = 'none';
                    tabbar.classList.add('hidden');
                    main.classList.add('no-tabbar');
                    startRevisionJourney(params.chapter_id, params.chapter_name);
                    break;

                // ════════ OPD (adaptive chapter test engine) ════════
                case 'opd':
                    document.getElementById('view-opd').classList.add('active');
                    document.getElementById('topbar-title').textContent = 'OPD';
                    document.querySelector('.mnav-item[data-view="opd"]')?.classList.add('active');
                    loadOpdHub();
                    break;

                case 'opd-chapter':
                    document.getElementById('view-opd-chapter').classList.add('active');
                    document.getElementById('topbar-title').textContent =
                        params.chapter_title || 'Case File';
                    document.querySelector('.mnav-item[data-view="opd"]')?.classList.add('active');
                    loadOpdChapter(params.chapter_id, params.chapter_title);
                    break;

                case 'opd-test':
                    // Focused full-screen mode, same as arena-test/pyq-test:
                    // hide the shell chrome; the shared OMR engine renders
                    // its own sticky top bar + footer (mode: 'opd').
                    document.getElementById('view-opd-test').classList.add('active');
                    topbar.style.display = 'none';
                    tabbar.classList.add('hidden');
                    main.classList.add('no-tabbar');
                    startOpdTest(params);
                    break;

                case 'opd-results':
                    document.getElementById('view-opd-results').classList.add('active');
                    document.getElementById('topbar-title').textContent = 'Test Results';
                    document.querySelector('.mnav-item[data-view="opd"]')?.classList.add('active');
                    showOpdResultsView(params);
                    break;

                case 'opd-analysis':
                    document.getElementById('view-opd-analysis').classList.add('active');
                    document.getElementById('topbar-title').textContent =
                        params.test_num != null ? 'Test ' + params.test_num : 'Test Analysis';
                    document.querySelector('.mnav-item[data-view="opd"]')?.classList.add('active');
                    loadOpdAnalysis(params);
                    break;

                // ════════ PRACTICE HUB (Arena · PYQ Vault · AIR Rankings) ════════
                case 'practice-hub': {
                    // Thin router: the hub's segmented switcher lives inside
                    // each landing view (arena / pyq / air), so forward there.
                    const tab = params.tab === 'pyq' ? 'pyq'
                        : params.tab === 'air' ? 'air' : 'arena';
                    navigate(tab, params);
                    return;
                }

                case 'arena':
                    document.getElementById('view-arena').classList.add('active');
                    document.getElementById('topbar-title').textContent = 'NEET Arena';
                    document.querySelector('.mnav-item[data-view="arena"]')?.classList.add('active');
                    loadArenaLanding();
                    break;

                case 'pyq':
                    // PYQ Vault no longer has a bottom tab — it lives inside the
                    // Practice Hub switcher, so the Arena tab stays lit.
                    document.getElementById('view-pyq').classList.add('active');
                    document.getElementById('topbar-title').textContent = 'PYQ Vault';
                    document.querySelector('.mnav-item[data-view="arena"]')?.classList.add('active');
                    loadPyqLanding();
                    break;

                case 'air':
                    // AIR Rankings has NO bottom tab of its own — reached only
                    // via the segmented switcher inside the Practice Hub.
                    document.getElementById('view-air').classList.add('active');
                    document.getElementById('topbar-title').textContent = 'AIR Rankings';
                    document.querySelector('.mnav-item[data-view="arena"]')?.classList.add('active');
                    loadAirRankings();
                    break;

                case 'arena-test':
                case 'pyq-test': {
                    // Test-taking is a focused full-screen mode, same as the
                    // Concept Studio journey: hide the shell chrome; the
                    // engine renders its own sticky top bar + footer.
                    const mode = viewName === 'arena-test' ? 'arena' : 'pyq';
                    document.getElementById(`view-${viewName}`).classList.add('active');
                    topbar.style.display = 'none';
                    tabbar.classList.add('hidden');
                    main.classList.add('no-tabbar');
                    startPracticeTest(mode, params);
                    break;
                }

                case 'arena-results':
                case 'pyq-results': {
                    const mode = viewName === 'arena-results' ? 'arena' : 'pyq';
                    document.getElementById(`view-${viewName}`).classList.add('active');
                    document.getElementById('topbar-title').textContent =
                        mode === 'arena' ? 'Arena Results' : 'PYQ Results';
                    document.querySelector('.mnav-item[data-view="arena"]')?.classList.add('active');
                    showTestResultsView(mode, params);
                    break;
                }

                case 'arena-leaderboard':
                case 'pyq-leaderboard': {
                    const mode = viewName === 'arena-leaderboard' ? 'arena' : 'pyq';
                    document.getElementById(`view-${viewName}`).classList.add('active');
                    document.getElementById('topbar-title').textContent = 'Leaderboard';
                    document.querySelector('.mnav-item[data-view="arena"]')?.classList.add('active');
                    loadPaperLeaderboard(mode, params.year, params.paper_code);
                    break;
                }

                case 'arena-history':
                case 'pyq-history': {
                    const mode = viewName === 'arena-history' ? 'arena' : 'pyq';
                    document.getElementById(`view-${viewName}`).classList.add('active');
                    document.getElementById('topbar-title').textContent =
                        mode === 'arena' ? 'Arena History' : 'PYQ History';
                    document.querySelector('.mnav-item[data-view="arena"]')?.classList.add('active');
                    loadPracticeHistory(mode);
                    break;
                }

                // ════════ STUDY MATERIAL (PDF library / reader) ════════
                case 'study-material':
                    document.getElementById('view-study-material').classList.add('active');
                    document.getElementById('topbar-title').textContent = 'Library';
                    document.querySelector('.mnav-item[data-view="library"]')?.classList.add('active');
                    mountLibrarySwitcher('material');
                    loadStudyMaterial();
                    break;

                case 'study-chapters':
                    // Deep screen — no switcher (you're inside a subject now).
                    document.getElementById('view-study-chapters').classList.add('active');
                    document.getElementById('topbar-title').textContent =
                        `${params.subject || 'Chapters'} · Class ${params.class_level || ''}`;
                    document.querySelector('.mnav-item[data-view="library"]')?.classList.add('active');
                    loadStudyChapters(params.subject, params.class_level);
                    break;

                case 'pdf-reader':
                    // The reader is a focused full-screen mode, same as the
                    // Concept Studio journey and the Arena/PYQ test screens:
                    // hide the shell chrome; the reader renders its own
                    // sticky top bar and bottom toolbar.
                    document.getElementById('view-pdf-reader').classList.add('active');
                    topbar.style.display = 'none';
                    tabbar.classList.add('hidden');
                    main.classList.add('no-tabbar');
                    openPdfReader(params.chapter);
                    break;

                // ════════ REVISION NOTES (notebooks) ════════
                case 'revision-notes':
                    document.getElementById('view-revision-notes').classList.add('active');
                    document.getElementById('topbar-title').textContent = 'Library';
                    document.querySelector('.mnav-item[data-view="library"]')?.classList.add('active');
                    mountLibrarySwitcher('notes');
                    loadRevisionNotes();
                    break;

                case 'notebook-detail':
                    document.getElementById('view-notebook-detail').classList.add('active');
                    document.getElementById('topbar-title').textContent = 'Notebook';
                    document.querySelector('.mnav-item[data-view="library"]')?.classList.add('active');
                    loadNotebookDetail(params.notebook_id);
                    break;

                // ════════ PROFILE ════════
                // Keeps the tab bar visible (it is a shell screen), but lights
                // no tab: Profile does not belong to any of the five.
                case 'doubts':
                    document.getElementById('view-doubts').classList.add('active');
                    document.getElementById('topbar-title').textContent = 'Doubts';
                    document.getElementById('topbar-sub').textContent = 'Ask. Get answers.';
                    ndDoubtsMount('doubts-content', 'student');
                    break;

                case 'profile':
                    document.getElementById('view-profile').classList.add('active');
                    document.getElementById('topbar-title').textContent = 'Profile';
                    loadProfile();
                    break;
            }
            window.scrollTo({ top: 0 });
        }

        function showComingSoon(title) {
            document.getElementById('coming-soon-title').textContent = `${title} — Coming Soon`;
            document.getElementById('coming-soon-copy').textContent =
                SOON_COPY[title] || `${title} — coming soon to the mobile app.`;
            navigate('coming-soon', { title });
        }
    </script>
    <script src="quotes.js"></script>
    <script src="concept-studio.js"></script>
    <!-- Desktop-only Concept Studio engine. Self-gates to >=1024px via matchMedia:
         on phones the IIFE registers one idle listener and does nothing else
         (no globals overridden, no DOM touched). Must load AFTER concept-studio.js,
         which defines the loadQuickRevise / loadReviseChapters / startRevisionJourney
         entry points this file overrides when active. -->
    <script src="concept-studio-desktop.js"></script>
    <script src="practice-hub.js"></script>
    <script src="test-engine.js"></script>
    <script src="opd.js"></script>
    <!-- Desktop-only Arena engine. Self-gates to >=1024px via matchMedia:
         on phones the IIFE registers one idle listener and does nothing
         else (no globals overridden, no DOM touched). Must load AFTER
         practice-hub.js + test-engine.js (whose loadArenaLanding /
         renderTestShell / renderTestResults etc. it overrides when
         active) and after opd.js (so OPD's shared-engine usage is fully
         wired before the override captures the render functions). -->
    <script src="arena-desktop.js"></script>
    <!-- OPD desktop layer. Self-gates to >=1024px via matchMedia: on
         phones the IIFE registers one idle listener and does nothing
         else (no globals overridden, no DOM touched, no overlay built).
         At >=1024px it captures OPD's render entry points (renderOpdHub,
         renderOpdChapter, renderOpdResults, the intervention renderers,
         opdIntOverlayEl, ...), re-homes them into a widescreen layout by
         reusing opd.js's own state/handlers/helpers, and restores every
         original verbatim if the viewport drops below 1024px. Must load
         AFTER opd.js (so those functions exist to capture) and after
         arena-desktop.js (which owns the shared in-test engine). -->
    <script src="opd-desktop.js"></script>
    <script src="revision-notes.js"></script>
    <script src="study-material.js"></script>
    <script src="library.js"></script>

    <!-- LIBRARY desktop layer. MUST load after revision-notes.js /
         study-material.js / library.js so it can capture their render
         entry points. Self-gated with matchMedia('(min-width:1024px)'):
         on a phone it registers one idle listener and does nothing else. -->
    <script src="libdesk-desktop.js"></script>
    <script src="profile.js"></script>
    <!-- DOUBTS: shared verbatim with portal.html. Depends only on
         shared.js (apiCall / escapeHtml / ndToast). -->
    <script src="doubts.js"></script>
    <link rel="stylesheet" href="nia.css">
    <script src="nia.js"></script>
    <script src="system-bars.js"></script>
    <!-- home.js last: it uses phOpenSheet() from practice-hub.js and
         nextQuote() from quotes.js -->
    <script src="home.js"></script>

</body>
